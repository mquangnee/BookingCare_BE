# Deploy BookingCare API (Dockerfile at repo root) to Google Cloud Run.
#
# --- Google Cloud (one-time) ---
# 1) Enable APIs: Cloud Run, Artifact Registry, IAM (if prompted).
# 2) Create Artifact Registry Docker repository, e.g.:
#    gcloud artifacts repositories create bookingcare \
#      --repository-format=docker --location=YOUR_REGION
# 3) Create a service account for CI (e.g. github-actions-deploy) with roles:
#    - Artifact Registry Writer
#    - Cloud Run Admin
#    - Service Account User (on the Cloud Run runtime SA if you use a custom one)
#    Create a JSON key and store the full JSON as GitHub secret GCP_SA_KEY.
#
# --- GitHub repository ---
# Settings → Secrets and variables → Actions
#   Secrets:
#     GCP_SA_KEY                    (service account JSON)
#     DATABASE_CONNECTION_STRING    (SQL connection string for production)
#   Maps to env var ConnectionStrings__ConnectedDb on Cloud Run — same as
#   appsettings.json "ConnectionStrings:ConnectedDb" without editing the file.
#   Variables (tab “Variables”):
#     GCP_PROJECT_ID      e.g. my-gcp-project
#     GCP_REGION          e.g. asia-southeast1
#     GCP_GAR_REPOSITORY  Artifact Registry repo id (e.g. bookingcare)
#     GCP_CLOUD_RUN_SERVICE Cloud Run service name (e.g. bookingcare-api)
#     GCP_TASK_QUEUE_ID   e.g. bookingcare-queue
#     GCP_BUCKET_NAME     e.g. bookingcare-resources
#     CLOUD_RUN_URL       Cloud Run service URL (set after first deploy, e.g. https://bookingcare-api-xxxx.run.app)
#     Note: GoogleCloud__SchedulerServiceAccount is set directly in appsettings.json (not via GitHub Variable)
#
# --- Runtime configuration ---
# This workflow sets ConnectionStrings__ConnectedDb from DATABASE_CONNECTION_STRING.
# Set other secrets in Cloud Run console or extend the deploy step, e.g.:
#   Jwt__SecretKey, Jwt__Issuer, Jwt__Audience
#   Smtp__Host, Smtp__Port, Smtp__From, Smtp__Password
#   Sepay__MerchantId, Sepay__SecretKey (or use JSON / Secret Manager)
#   Cors__AllowedOrigins__0, Cors__AllowedOrigins__1, ... (or use JSON / Secret Manager)
# Add your Firebase Hosting origin to CORS for the live API URL.
#
# Other Cloud Run env vars are preserved when possible; --update-env-vars merges.
# If the connection string contains commas, the deploy step uses gcloud delimiter ^##^.

name: Deploy API to Cloud Run

# Manual only: Actions → this workflow → “Run workflow”. Pick the branch in
# “Use workflow from”; that branch’s code is checked out by default. Optionally
# set “Git ref to deploy” to override (branch name, tag, or full SHA).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Leave empty to use the branch selected in “Use workflow from”.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_GAR_REPOSITORY: ${{ vars.GCP_GAR_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_TASK_QUEUE_ID: ${{ vars.GCP_TASK_QUEUE_ID }}
      GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
      CLOUD_RUN_URL: ${{ vars.CLOUD_RUN_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set gcloud project and Docker credential helper
        run: |
          gcloud config set project "${GCP_PROJECT_ID}" --quiet
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_GAR_REPOSITORY}/${GCP_CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" -f Dockerfile .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        env:
          CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          echo "=== GitHub Variables ==="
          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          echo "GCP_REGION=${GCP_REGION}"
          echo "GCP_GAR_REPOSITORY=${GCP_GAR_REPOSITORY}"
          echo "GCP_CLOUD_RUN_SERVICE=${GCP_CLOUD_RUN_SERVICE}"
          echo "GCP_TASK_QUEUE_ID=${GCP_TASK_QUEUE_ID}"
          echo "GCP_BUCKET_NAME=${GCP_BUCKET_NAME}"
          echo "CLOUD_RUN_URL=${CLOUD_RUN_URL}"
          echo "========================"
          if [ -z "${CONNECTION_STRING}" ]; then
            echo "Missing Actions secret DATABASE_CONNECTION_STRING"
            exit 1
          fi
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_GAR_REPOSITORY}/${GCP_CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
             --update-env-vars ConnectionStrings__ConnectedDb="${CONNECTION_STRING}",ASPNETCORE_ENVIRONMENT=Production,ENVIRONMENT=Production,GoogleCloud__CloudScheduler__ProjectId="${GCP_PROJECT_ID}",GoogleCloud__CloudScheduler__LocationId="${GCP_REGION}",GoogleCloud__CloudScheduler__QueueId="${GCP_TASK_QUEUE_ID}",GoogleCloud__CloudStorage__BucketName="${GCP_BUCKET_NAME}",Jobs__SendAppointmentSummary__EndPoint="${CLOUD_RUN_URL}/api/tasks/send-appointment-summary"
